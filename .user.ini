; SimpleGallery 2026 - Per-directory PHP upload & execution settings
; Recommended settings for large photo and video uploads (FastCGI / PHP-FPM / Nginx / Apache)
upload_max_filesize = 128M
post_max_size = 128M
max_file_uploads = 1000
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
