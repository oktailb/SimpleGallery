<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="500" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    Pipeline Média &amp; Système de Fichiers Virtuel (VFS)
  </text>
  <text x="500" y="58" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    Distribution intelligente, jailing anti-traversal, cache WebP et distinction stream vs téléchargement direct
  </text>

  <!-- 1. CLIENT REQUESTS -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <rect width="260" height="26" rx="10" fill="url(#clientGrad)" />
    <rect y="16" width="260" height="10" fill="url(#clientGrad)" />
    <text x="130" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">1. REQUÊTE CLIENT (HTTP GET)</text>

    <!-- Request items -->
    <rect x="12" y="36" width="236" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="52" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">thumb.php?file=...&amp;raw=1</text>
    <text x="20" y="68" fill="#94a3b8" font-size="9" font-family="sans-serif">Affichage inline (Visionneuse, HTML5 Video)</text>
    <text x="20" y="80" fill="#64748b" font-size="8" font-family="sans-serif">Pas de blocage attachment direct</text>

    <rect x="12" y="98" width="236" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="114" fill="#f59e0b" font-size="10" font-weight="700" font-family="monospace">thumb.php?file=...&amp;download=1</text>
    <text x="20" y="130" fill="#94a3b8" font-size="9" font-family="sans-serif">Téléchargement direct en pièce jointe</text>
    <text x="20" y="142" fill="#ef4444" font-size="8" font-family="sans-serif">Vérification $allow_direct_download &amp; perm</text>

    <rect x="12" y="160" width="236" height="56" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="176" fill="#10b981" font-size="10" font-weight="700" font-family="monospace">thumb.php?file=...&amp;size=300</text>
    <text x="20" y="192" fill="#94a3b8" font-size="9" font-family="sans-serif">Génération de miniature (Grid / Polaroid)</text>
    <text x="20" y="206" fill="#a7f3d0" font-size="8" font-family="sans-serif">Compression WebP + Ratio auto</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 290 200 L 340 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <polygon points="340,200 332,195 332,205" fill="#38bdf8"/>

  <!-- 2. VFS & SECURITY GATEWAY -->
  <g transform="translate(345, 85)" filter="url(#shadow)">
    <rect width="310" height="230" rx="10" fill="#1e180a" stroke="#d97706" stroke-width="1.5" />
    <rect width="310" height="26" rx="10" fill="url(#gateGrad)" />
    <rect y="16" width="310" height="10" fill="url(#gateGrad)" />
    <text x="155" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">2. VFS &amp; PASSERELLE DE SÉCURITÉ</text>

    <!-- Path Sanitization -->
    <rect x="14" y="36" width="282" height="42" rx="6" fill="#292010" stroke="#78350f" stroke-width="1"/>
    <text x="24" y="52" fill="#fcd34d" font-size="10" font-weight="700" font-family="sans-serif">🛡️ Path Normalization &amp; Jailing</text>
    <text x="24" y="68" fill="#fef3c7" font-size="9" font-family="sans-serif">Rejet strict ../, null bytes, jailing dans $real_base_dir</text>

    <!-- Access Gate -->
    <rect x="14" y="86" width="282" height="42" rx="6" fill="#292010" stroke="#78350f" stroke-width="1"/>
    <text x="24" y="102" fill="#fcd34d" font-size="10" font-weight="700" font-family="sans-serif">🔒 Dossiers Protégés &amp; Dotfiles</text>
    <text x="24" y="118" fill="#fef3c7" font-size="9" font-family="sans-serif">Contrôle .password, blocage .private &amp; fichiers cachés</text>

    <!-- Download Gate -->
    <rect x="14" y="136" width="282" height="78" rx="6" fill="#292010" stroke="#78350f" stroke-width="1"/>
    <text x="24" y="152" fill="#fcd34d" font-size="10" font-weight="700" font-family="sans-serif">⚖️ Filtre de Téléchargement Direct</text>
    <text x="24" y="168" fill="#cbd5e1" font-size="9" font-family="sans-serif">Si download=1 &amp; visiteur non authentifié :</text>
    <text x="24" y="184" fill="#fca5a5" font-size="9" font-family="sans-serif">• can_download_item == false ➔ 403 Forbidden</text>
    <text x="24" y="200" fill="#86efac" font-size="9" font-family="sans-serif">• can_download_item == true ➔ Autorisé</text>
  </g>

  <!-- ARROW 2 -> 3 (Right) -->
  <path d="M 655 150 L 705 150" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="705,150 697,145 697,155" fill="#10b981"/>

  <!-- ARROW 2 -> 4 (Down) -->
  <path d="M 500 315 L 500 365" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <polygon points="500,365 495,357 505,357" fill="#38bdf8"/>

  <!-- 3. CACHE & THUMBNAILS LAYER -->
  <g transform="translate(710, 85)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#061c14" stroke="#059669" stroke-width="1.5" />
    <rect width="260" height="26" rx="10" fill="url(#cacheGrad)" />
    <rect y="16" width="260" height="10" fill="url(#cacheGrad)" />
    <text x="130" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">3. CACHE DISQUE (storage/.thumbnails/)</text>

    <!-- Hash calculation -->
    <rect x="12" y="36" width="236" height="48" rx="6" fill="#0c2d20" stroke="#047857" stroke-width="1"/>
    <text x="20" y="52" fill="#6ee7b7" font-size="10" font-weight="700" font-family="sans-serif">🔑 Clé de Cache Unique</text>
    <text x="20" y="68" fill="#a7f3d0" font-size="9" font-family="monospace">hash(path + mtime + size + mode)</text>

    <!-- Cache hit -->
    <rect x="12" y="92" width="236" height="56" rx="6" fill="#0c2d20" stroke="#047857" stroke-width="1"/>
    <text x="20" y="108" fill="#6ee7b7" font-size="10" font-weight="700" font-family="sans-serif">⚡ Cache Hit (Fichier WebP existant)</text>
    <text x="20" y="124" fill="#a7f3d0" font-size="9" font-family="sans-serif">Vérification ETag / If-None-Match</text>
    <text x="20" y="138" fill="#34d399" font-size="9" font-weight="700" font-family="monospace">➔ 304 Not Modified ou Flux Direct</text>

    <!-- Cache miss -->
    <rect x="12" y="156" width="236" height="60" rx="6" fill="#0c2d20" stroke="#047857" stroke-width="1"/>
    <text x="20" y="172" fill="#fbbf24" font-size="10" font-weight="700" font-family="sans-serif">⏳ Cache Miss (Nouveau média)</text>
    <text x="20" y="188" fill="#e2e8f0" font-size="9" font-family="sans-serif">Délégation aux convertisseurs dédiés</text>
    <text x="20" y="202" fill="#c084fc" font-size="9" font-weight="700" font-family="sans-serif">➔ Appel Moteurs Multimédia (GD/FFmpeg)</text>
  </g>

  <!-- ARROW 3 MISS -> 4 WORKERS (Diagonal Down-Left) -->
  <path d="M 710 270 L 655 365" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="655,365 660,357 665,363" fill="#a855f7"/>

  <!-- 4. STREAMING OR ATTACHMENT DISTRIBUTION -->
  <g transform="translate(30, 370)" filter="url(#shadow)">
    <rect width="420" height="230" rx="10" fill="#08182b" stroke="#0284c7" stroke-width="1.5" />
    <rect width="420" height="26" rx="10" fill="url(#streamGrad)" />
    <rect y="16" width="420" height="10" fill="url(#streamGrad)" />
    <text x="210" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">4A. FLUX BRUT (RAW=1) &amp; TÉLÉCHARGEMENT</text>

    <!-- Inline stream -->
    <rect x="14" y="38" width="392" height="82" rx="6" fill="#0c2440" stroke="#0369a1" stroke-width="1"/>
    <text x="24" y="56" fill="#38bdf8" font-size="11" font-weight="700" font-family="sans-serif">👁️ Distribution Inline (raw=1)</text>
    <text x="24" y="74" fill="#bae6fd" font-size="9" font-family="monospace">Content-Disposition: inline; filename="..."</text>
    <text x="24" y="90" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Support HTTP Range (206 Partial Content) pour seek vidéo/audio</text>
    <text x="24" y="104" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Pas de pop-up de téléchargement disque du navigateur</text>

    <!-- Attachment download -->
    <rect x="14" y="130" width="392" height="82" rx="6" fill="#0c2440" stroke="#0369a1" stroke-width="1"/>
    <text x="24" y="148" fill="#38bdf8" font-size="11" font-weight="700" font-family="sans-serif">💾 Distribution Pièce Jointe (download=1)</text>
    <text x="24" y="166" fill="#bae6fd" font-size="9" font-family="monospace">Content-Disposition: attachment; filename="..."</text>
    <text x="24" y="182" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Force l'enregistrement physique sur la machine cliente</text>
    <text x="24" y="196" fill="#fca5a5" font-size="9" font-family="sans-serif">• Strictement réservé aux utilisateurs ayant la permission download</text>
  </g>

  <!-- 5. WORKERS MULTIMEDIA -->
  <g transform="translate(480, 370)" filter="url(#shadow)">
    <rect width="490" height="230" rx="10" fill="#180e29" stroke="#7e22ce" stroke-width="1.5" />
    <rect width="490" height="26" rx="10" fill="url(#workerGrad)" />
    <rect y="16" width="490" height="10" fill="url(#workerGrad)" />
    <text x="245" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">4B. MOTEURS MULTIMÉDIA (EXTRACTION &amp; CONVERSION)</text>

    <!-- Workers list -->
    <g transform="translate(14, 38)">
      <!-- Image GD -->
      <rect x="0" y="0" width="220" height="78" rx="6" fill="#251640" stroke="#581c87" stroke-width="1"/>
      <text x="12" y="20" fill="#e9d5ff" font-size="10" font-weight="700" font-family="sans-serif">🖼️ Images (GD / Imagick)</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Formats : JPG, PNG, GIF, WEBP</text>
      <text x="12" y="50" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Orientation EXIF auto-rotate</text>
      <text x="12" y="64" fill="#a855f7" font-size="9" font-family="monospace">• Compression WebP 82%</text>

      <!-- Video FFmpeg -->
      <rect x="238" y="0" width="224" height="78" rx="6" fill="#251640" stroke="#581c87" stroke-width="1"/>
      <text x="250" y="20" fill="#e9d5ff" font-size="10" font-weight="700" font-family="sans-serif">🎬 Vidéos (BinaryLocator / FFmpeg)</text>
      <text x="250" y="36" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Formats : MP4, MKV, AVI, WEBM</text>
      <text x="250" y="50" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Extraction frame à 10% de durée</text>
      <text x="250" y="64" fill="#a855f7" font-size="9" font-family="monospace">• Fallback durée statique (00:00:02)</text>

      <!-- PDF / Docs -->
      <rect x="0" y="90" width="220" height="78" rx="6" fill="#251640" stroke="#581c87" stroke-width="1"/>
      <text x="12" y="110" fill="#e9d5ff" font-size="10" font-weight="700" font-family="sans-serif">📄 Documents (PDF / Imagick)</text>
      <text x="12" y="126" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Rendu première page [0]</text>
      <text x="12" y="140" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Densité 150 DPI</text>
      <text x="12" y="154" fill="#a855f7" font-size="9" font-family="monospace">• Icône vectorielle si non installé</text>

      <!-- Audio ID3 -->
      <rect x="238" y="90" width="224" height="78" rx="6" fill="#251640" stroke="#581c87" stroke-width="1"/>
      <text x="250" y="110" fill="#e9d5ff" font-size="10" font-weight="700" font-family="sans-serif">🎵 Audio &amp; Podcasts (getid3)</text>
      <text x="250" y="126" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Extraction pochette ID3/APIC</text>
      <text x="250" y="140" fill="#cbd5e1" font-size="9" font-family="sans-serif">• Recherche cover.jpg / folder.jpg</text>
      <text x="250" y="154" fill="#a855f7" font-size="9" font-family="monospace">• Rendu vignette disque vinyle</text>
    </g>
  </g>

</svg>
