<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="920" height="540" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="460" y="38" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    Flux de Sécurité &amp; Distribution Média — thumb.php
  </text>
  <text x="460" y="58" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    Distinction claire entre le visionnage fluide en ligne (raw=1) et le téléchargement direct (download=1)
  </text>

  <!-- Step 1: HTTP Request -->
  <g transform="translate(340, 85)" filter="url(#shadow)">
    <rect width="240" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="24" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">Requête Client HTTP</text>
    <text x="120" y="40" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">system/endpoints/thumb.php</text>
  </g>

  <!-- Arrow down -->
  <path d="M 460 137 L 460 162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Directory Access Check -->
  <g transform="translate(310, 162)" filter="url(#shadow)">
    <rect width="300" height="64" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="150" y="24" fill="#e0e7ff" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">Dossier Accessible ?</text>
    <text x="150" y="42" fill="#c7d2fe" font-size="10" text-anchor="middle" font-family="sans-serif">is_dir_accessible(dirname($file_path))</text>
    <text x="150" y="55" fill="#a5b4fc" font-size="9" text-anchor="middle" font-family="sans-serif">(Vérification .private et .password)</text>
  </g>

  <!-- Arrow right to 403 Forbidden -->
  <path d="M 610 194 L 720 194" stroke="#f87171" stroke-width="2" stroke-dasharray="4"/>
  <text x="665" y="186" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">NON</text>

  <!-- Box 403 Dossier Privé -->
  <g transform="translate(720, 168)" filter="url(#shadow)">
    <rect width="160" height="52" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="80" y="22" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">⛔ 403 Forbidden</text>
    <text x="80" y="38" fill="#fecaca" font-size="9" text-anchor="middle" font-family="sans-serif">Dossier privé ou verrouillé</text>
  </g>

  <!-- Arrow down OUI -->
  <path d="M 460 226 L 460 260" stroke="#34d399" stroke-width="2" />
  <text x="475" y="246" fill="#34d399" font-size="10" font-weight="700" font-family="sans-serif">OUI</text>

  <!-- Step 3: Branching raw vs download -->
  <g transform="translate(290, 260)" filter="url(#shadow)">
    <polygon points="170,0 340,45 170,90 0,45" fill="#1e1e2e" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="170" y="42" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">Type d'accès demandé ?</text>
    <text x="170" y="56" fill="#7dd3fc" font-size="9" text-anchor="middle" font-family="monospace">raw=1 ou download=1 ?</text>
  </g>

  <!-- Branch Left: Inline Streaming (raw=1) -->
  <path d="M 290 305 L 170 305 L 170 345" stroke="#38bdf8" stroke-width="2" />
  <text x="215" y="296" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">raw=1 (Visionnage)</text>

  <g transform="translate(45, 345)" filter="url(#shadow)">
    <rect width="250" height="150" rx="10" fill="#0c2338" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="250" height="24" rx="10" fill="url(#blueGrad)"/>
    <rect y="14" width="250" height="10" fill="url(#blueGrad)"/>
    <text x="125" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">Flux Multimédia en Ligne (Inline)</text>

    <text x="15" y="48" fill="#bae6fd" font-size="10" font-weight="700" font-family="sans-serif">✓ Content-Disposition: inline</text>
    <text x="15" y="66" fill="#e0f2fe" font-size="9" font-family="sans-serif">• Visionneuse : zoom &amp; inspection</text>
    <text x="15" y="82" fill="#e0f2fe" font-size="9" font-family="sans-serif">• Lecteur Vidéo : streaming MP4/WebM</text>
    <text x="15" y="98" fill="#e0f2fe" font-size="9" font-family="sans-serif">• Lecteur Audio : streaming MP3/FLAC</text>
    <text x="15" y="114" fill="#e0f2fe" font-size="9" font-family="sans-serif">• Lecteur Document : PDF vectoriel</text>

    <rect x="15" y="125" width="220" height="18" rx="4" fill="#082f49"/>
    <text x="125" y="137" fill="#38bdf8" font-size="8" font-weight="600" text-anchor="middle" font-family="sans-serif">🔒 oncontextmenu=false si droits restreints</text>
  </g>

  <!-- Branch Right: Download as Attachment (download=1) -->
  <path d="M 630 305 L 740 305 L 740 345" stroke="#a78bfa" stroke-width="2" />
  <text x="690" y="296" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">download=1 (Fichier)</text>

  <g transform="translate(620, 345)" filter="url(#shadow)">
    <rect width="250" height="85" rx="8" fill="#201a33" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="125" y="22" fill="#ede9fe" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">Téléchargement Autorisé ?</text>
    <text x="125" y="38" fill="#c4b5fd" font-size="9" text-anchor="middle" font-family="sans-serif">$isAdmin || ($allow_cfg &amp;&amp; can_download_item)</text>

    <!-- Branch Sub-left: OUI Attachment -->
    <path d="M 65 52 L 65 72" stroke="#34d399" stroke-width="2"/>
    <!-- Branch Sub-right: NON 403 -->
    <path d="M 185 52 L 185 72" stroke="#f87171" stroke-width="2"/>
    <text x="50" y="66" fill="#34d399" font-size="9" font-weight="700" font-family="sans-serif">OUI</text>
    <text x="200" y="66" fill="#f87171" font-size="9" font-weight="700" font-family="sans-serif">NON</text>
  </g>

  <!-- Outcome 1: Attachment OK -->
  <g transform="translate(560, 440)" filter="url(#shadow)">
    <rect width="140" height="60" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
    <text x="70" y="22" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">📥 Téléchargement OK</text>
    <text x="70" y="38" fill="#d1fae5" font-size="8" text-anchor="middle" font-family="sans-serif">Content-Disposition:</text>
    <text x="70" y="50" fill="#6ee7b7" font-size="8" font-family="monospace" text-anchor="middle">attachment</text>
  </g>

  <!-- Outcome 2: 403 Forbidden Download -->
  <g transform="translate(730, 440)" filter="url(#shadow)">
    <rect width="160" height="60" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="80" y="22" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">⛔ 403 Forbidden</text>
    <text x="80" y="38" fill="#fecaca" font-size="8" text-anchor="middle" font-family="sans-serif">Direct download restricted</text>
    <text x="80" y="50" fill="#f87171" font-size="8" text-anchor="middle" font-family="sans-serif">(can_download_item = false)</text>
  </g>

  <!-- Arrows from Decision to Outcomes -->
  <path d="M 685 430 L 630 440" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 805 430 L 810 440" stroke="#f87171" stroke-width="1.5"/>
</svg>
